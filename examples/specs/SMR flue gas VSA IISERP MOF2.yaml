# Steam-methane-reformer flue gas (20 % CO2) on IISERP MOF2: four-step cycle with light product
# pressurization at its optimal operating point. Parameters of Subraveti et al., Sep. Purif.
# Technol. 256 (2021) 117832, https://doi.org/10.1016/j.seppur.2020.117832
version: 1
components:
- CO2
- N2
gas:
  equation_of_state: ideal
  molar_masses:
    CO2: 0.04401 kg/mol
    N2: 0.028014 kg/mol
  heat_capacity: 30.7 J/(mol K)
  viscosity: 1.72e-05 Pa s
  molecular_diffusivity: 1.6e-05 m2/s
  adiabatic_constant: linear_co2
adsorbent:
  name: IISERP MOF2
  particle_density: 937.7 kg/m3
  particle_radius: 0.00075 m
  particle_voidage: 0.35
  tortuosity: 3.0
  heat_capacity: 1070.0 J/(kg K)
  adsorbed_phase_heat_capacity: 30.7 J/(mol K)
  heat_of_adsorption:
    CO2: 31135.0 J/mol
    N2: 11890.0 J/mol
  isotherm:
    model: dual_site_langmuir
    CO2:
      qsb: 3.29 mol/kg
      qsd: 1.89 mol/kg
      b0: 9.39e-08 m3/mol
      d0: 5.23e-07 m3/mol
      dUb: -31135.0 J/mol
      dUd: -31135.0 J/mol
    N2:
      qsb: 3.29 mol/kg
      qsd: 1.89 mol/kg
      b0: 2.55e-07 m3/mol
      d0: 2.55e-07 m3/mol
      dUb: -11890.0 J/mol
      dUd: -11890.0 J/mol
  kinetics:
    model: macropore_ldf
    max_rate: 1000.0 1/s
bed:
  length: 8.8 m
  inner_radius: 1.4666666666666668 m
  outer_radius: 1.6133333333333335 m
  voidage: 0.37
  pressure_drop: ergun
  axial_thermal_conductivity: 0.09 W/(m K)
  include_pore_gas: false
  wall:
    density: 7800.0 kg/m3
    heat_capacity: 502.0 J/(kg K)
    thermal_conductivity: 16.0 W/(m K)
  heat_transfer:
    inner: 0.0 W/(m2 K)
    outer: 0.0 W/(m2 K)
    ambient_temperature: 298.15 K
  dead_volume:
    feed: 0.0 m3
    product: 0.0 m3
model:
  cells: 30
  scheme: weno
  backend: auto
  reference:
    pressure: 1.02 bar
    temperature: 298.15 K
    velocity: 1.2 m/s
cycle:
  key_component: CO2
  product_stream: product
  feed_stream: feed
  steps:
  - name: FEED
    duration: 118.0 s
    feed_end:
      type: feed
      stream: stream_1
      velocity: 1.2 m/s
      supply_pressure: 1.02 bar
      efficiency: 0.8
      label: feed
    product_end:
      type: outlet
      pressure: 1.02 bar
      label: raffinate
      discharge_pressure: none
      efficiency: 0.72
      check_valve: false
      record_as: raffinate
  - name: BLOW
    until:
      pressure: 0.31 bar
      at: product
      direction: falling
    max_duration: 5000.0 s
    feed_end:
      type: closed
    product_end:
      type: vacuum_pump
      label: blowdown
      discharge_pressure: 1.01325 bar
      efficiency: falling_vacuum
      volumetric_flow: 5434.0 m3/h
  - name: EVAC
    until:
      pressure: 0.036 bar
      at: feed
      direction: falling
    max_duration: 5000.0 s
    feed_end:
      type: vacuum_pump
      label: product
      discharge_pressure: 1.01325 bar
      efficiency: falling_vacuum
      volumetric_flow: 16341.0 m3/h
    product_end:
      type: closed
  - name: LPPR
    until:
      pressure: 1.0098 bar
      at: feed
      direction: rising
    max_duration: 118.0 s
    feed_end:
      type: closed
    product_end:
      type: replay
      record: raffinate
      label: raffinate
      offset: 0.0 s
      max_pressure: 1.02 bar
  - name: PRES
    until:
      pressure: 1.01898 bar
      at: product
      direction: rising
    max_duration: 60.0 s
    feed_end:
      type: pressure_inlet
      stream: stream_1
      pressure: 1.02 bar
      supply_pressure: 1.02 bar
      efficiency: 0.8
      label: feed
    product_end:
      type: closed
initial:
  pressure: 1.02 bar
  temperature: 298.15 K
  composition:
    CO2: 0.2
    N2: 0.8
streams:
  stream_1:
    composition:
      CO2: 0.2
      N2: 0.8
    temperature: 298.15 K
