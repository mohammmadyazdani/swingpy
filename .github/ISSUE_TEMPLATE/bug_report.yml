name: Bug report
description: Something does not work or gives a wrong result
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: script
    attributes:
      label: A short script that shows the problem
      description: As short as possible; it is pasted as Python code.
      render: python
  - type: textarea
    id: output
    attributes:
      label: Error message or output
      render: text
  - type: input
    id: versions
    attributes:
      label: Versions
      description: SwingPy, Python and the operating system, for example "SwingPy 1.0.0, Python 3.12, Windows 11".
    validations:
      required: true
